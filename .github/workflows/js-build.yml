name: JS Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install pkfire
        uses: mizchi/pkfire@v0.12.1
        with:
          version: 0.12.1
      - name: Install pkspec
        uses: mizchi/pkspec@v0.4.1
        with:
          version: 0.4.1
          pkl-version: none

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install MoonBit CLI
        uses: ./.github/actions/setup-moonbit

      - name: Moon update
        run: moon update

      - name: Guard compat allowlist
        run: pkspec exec -f Test.pkl --only git-compat-allowlist

      - name: Run JS build tests
        run: pkf run test-js-build
